<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odoo Agent · 销售看板</title>
  <link rel="stylesheet" href="styles.css">
  <script src="echarts.min.js?v=6.1.0" defer></script>
  <script src="sidebar.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="btn btn-icon mobile-menu" type="button" data-menu-toggle aria-label="打开导航">☰</button><div><h1 class="page-title">销售看板</h1><div class="page-subtitle">销售订单实时经营概览</div></div></div>
        <div class="topbar-right"><span class="top-status"><span class="status-dot"></span><span data-dashboard-updated>正在读取</span></span><span class="avatar">我</span></div>
      </header>

      <div class="content">
        <section class="card filters" aria-label="看板筛选条件">
          <div class="filter-group">
            <div class="segmented" aria-label="数据周期">
              <button class="segment-btn" type="button" data-period="week">本周</button>
              <button class="segment-btn active" type="button" data-period="month">本月</button>
              <button class="segment-btn" type="button" data-period="quarter">本季度</button>
            </div>
            <select class="select" data-salesperson-filter aria-label="销售员" style="width: 160px"><option value="">全部销售员</option></select>
          </div>
          <div class="filter-group"><span class="page-subtitle" data-dashboard-range>口径：已确认订单 · 未税金额</span><button class="btn" type="button" data-dashboard-refresh>↻ 刷新</button></div>
        </section>

        <section class="kpi-grid" aria-label="销售关键指标">
          <article class="card kpi-card"><div class="kpi-top"><span class="kpi-label">销售额</span><span class="kpi-icon" data-currency-icon>¤</span></div><div class="kpi-value" data-dashboard-kpi="sales_amount">—</div><div class="kpi-note" data-dashboard-note="sales_amount">正在读取…</div></article>
          <article class="card kpi-card"><div class="kpi-top"><span class="kpi-label">订单数</span><span class="kpi-icon orange">▤</span></div><div class="kpi-value" data-dashboard-kpi="order_count">—</div><div class="kpi-note" data-dashboard-note="order_count">正在读取…</div></article>
          <article class="card kpi-card"><div class="kpi-top"><span class="kpi-label">平均订单额</span><span class="kpi-icon green">◎</span></div><div class="kpi-value" data-dashboard-kpi="average_order_value">—</div><div class="kpi-note" data-dashboard-note="average_order_value">正在读取…</div></article>
          <article class="card kpi-card"><div class="kpi-top"><span class="kpi-label">活跃客户</span><span class="kpi-icon blue">♙</span></div><div class="kpi-value" data-dashboard-kpi="active_customers">—</div><div class="kpi-note" data-dashboard-note="active_customers">正在读取…</div></article>
        </section>

        <section class="dashboard-grid">
          <article class="card panel">
            <div class="section-heading"><div><h2>销售趋势</h2><p data-trend-subtitle>已确认订单 · 未税金额</p></div><span class="badge" data-trend-change>正在读取</span></div>
            <div class="chart-wrap"><div class="dashboard-echart" data-dashboard-trend role="img" aria-label="真实销售额趋势"></div></div>
          </article>

          <article class="card panel">
            <div class="section-heading"><div><h2>订单状态</h2><p data-dashboard-status-subtitle>本月订单金额分布</p></div></div>
            <div class="dashboard-echart" data-dashboard-status role="img" aria-label="真实订单状态金额分布"></div>
          </article>
        </section>

        <section class="dashboard-grid" style="margin-top:18px">
          <article class="card panel">
            <div class="section-heading"><div><h2>客户销售排行</h2><p>按未税销售额排序</p></div><a href="chat.html?q=分析一下本月销售额最高的客户" class="btn btn-soft" data-dashboard-customer-ai>让 AI 分析</a></div>
            <div class="dashboard-echart customer-ranking-chart" data-dashboard-customers role="img" aria-label="真实客户销售排行"></div>
          </article>

          <article class="card panel">
            <div class="section-heading"><div><h2>交付与开票</h2><p>需要关注的订单</p></div></div>
            <div class="quick-list" data-dashboard-attention><div class="table-empty">正在读取待办订单…</div></div>
          </article>
        </section>

        <section class="card table-card">
          <div class="table-header"><div><h3>产品销售排行</h3><div class="page-subtitle">按已确认订单明细的未税金额排序</div></div><button class="btn" type="button" data-dashboard-export>导出 CSV</button></div>
          <div class="data-table-wrap"><table class="data-table"><thead><tr><th>排名</th><th>产品</th><th class="number">销售数量</th><th class="number">销售额</th><th class="number">占比</th></tr></thead><tbody data-product-ranking><tr><td colspan="5" class="table-empty">正在读取产品销售数据…</td></tr></tbody></table></div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" data-toast role="status"></div>
</body>
</html>
