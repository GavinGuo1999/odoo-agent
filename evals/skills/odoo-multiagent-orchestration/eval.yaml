# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json
name: odoo-multiagent-orchestration-trigger-eval
description: Offline trigger checks for the repository-scoped multi-agent orchestration skill.
skill: odoo-multiagent-orchestration
schemaVersion: "1.0"
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 60
  executor: mock
  model: mock
  parallel: false
  inject_skill_body: true
  skill_directories:
    - ../../../.agents/skills/odoo-multiagent-orchestration
  required_skills:
    - odoo-multiagent-orchestration
metrics:
  - name: trigger_accuracy
    weight: 1.0
    threshold: 1.0
    description: Positive and negative prompts must route to the intended skill boundary.
tasks:
  - tasks/*.yaml
